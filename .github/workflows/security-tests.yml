name: Native security regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run native tests with memory checks
        run: make -C test test CC=clang CFLAGS="-Wall -Wextra -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -std=c11 -DHOST_TEST"
